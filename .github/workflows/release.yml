name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun test

      - run: bun run typecheck

      - run: bun run compile

      - name: Pack plugin
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="opencode-kiro-auth-${version}.tgz"
          packed="$(npm pack)"
          if [ "$packed" != "$artifact" ]; then
            mv "$packed" "$artifact"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" "opencode-kiro-auth-${version}.tgz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
