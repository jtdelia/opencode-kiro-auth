name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Require tag to match package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Pack plugin
        run: |
          version="$(node -p "require('./package.json').version")"
          artifact="opencode-kiro-auth-${version}.tgz"
          packed="$(npm pack)"
          if [ "$packed" != "$artifact" ]; then
            mv "$packed" "$artifact"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "${GITHUB_REF_NAME}" "opencode-kiro-auth-${version}.tgz" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
